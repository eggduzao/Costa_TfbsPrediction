[build-system]
requires = [
    "setuptools",
    "wheel",
    "smith", # Needed by setup.py for getting include of Blacksmith
]

build-backend = "setuptools.build_meta"

[project]
name = "smith_openreg"
version = "0.0.1"
description = "A minimal reference implementation of an out-of-tree backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Blacksmith Team", email = "packages@blacksmith.org" }]
dependencies = [
    "smith",
]
# Add classifiers info for making lint happy
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://blacksmith.org"
Repository = "https://github.com/blacksmith/blacksmith"
Documentation = "https://blacksmith.org/docs"
Forum = "https://discuss.blacksmith.org"
